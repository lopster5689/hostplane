name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + vet + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o /tmp/control-plane .
      - name: unit tests
        run: go test -count=1 ./...

  integration:
    name: integration (Docker + MariaDB) + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: controlplane
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -prootpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: vet (integration build tag)
        # Catches compile breaks in tagged files even before Phase 7 is fully wired.
        run: go vet -tags=integration ./...
      - name: run full test suite (unit + integration)
        # The -tags=integration flag still includes un-tagged tests, so this
        # produces the total coverage number across all tests.
        run: go test -tags=integration -count=1 -timeout=15m -coverprofile=cover.out ./...
        env:
          CONTROL_DSN: root:rootpass@tcp(127.0.0.1:3306)/controlplane
          WP_DSN: root:rootpass@tcp(127.0.0.1:3306)/
      - name: coverage threshold (>=80%)
        # Locked at 80% per the testing-strategy decision table.
        # Will fail until Phase 7 integration tests land — that is intentional.
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 80) }'
